services:
  - type: web
    name: trading-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: TRADIER_TOKEN
        sync: false
      - key: TRADIER_BASE
        value: https://sandbox.tradier.com/v1
